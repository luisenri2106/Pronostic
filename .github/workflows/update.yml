name: Actualizar datos
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar actualizador
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 update.py
      - name: Guardar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actualizador@users.noreply.github.com"
          git add data.json state.json hist.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
